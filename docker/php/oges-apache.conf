# OGES-SHIELD vhost — front controller di public/index.php
#
# Routing sengaja pakai mod_rewrite (BUKAN FallbackResource): public/ punya
# direktori nyata `admin/` dan `api/` yang namanya bentrok dengan route
# aplikasi (/admin/approvals, /api/stream). FallbackResource cuma menangani
# 404, bukan direktori tanpa index → hasilnya 403. Aturan di bawah meniru
# perilaku `php -S` router mode: file nyata dilayani langsung, sisanya masuk
# ke index.php.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/public

    <Directory /app>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # DirectoryIndex dimatikan: setiap request yang bukan file nyata
        # (termasuk "/" dan direktori seperti /admin/ atau /api/) ditangani
        # index.php. Ini menghilangkan race antara mod_dir dan mod_rewrite
        # yang bisa menghasilkan 403 pada direktori tanpa index.
        DirectoryIndex disabled
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    # Jangan pernah sajikan dotfile / artefak sensitif
    <FilesMatch "(^\.|\.(env|ini|log|sql|bak|dist|md|yml|yaml)$)">
        Require all denied
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel warn
</VirtualHost>
