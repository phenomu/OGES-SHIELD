; OGES-SHIELD — PHP runtime tuning
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

memory_limit = 256M
; regenerasi report bisa menunggu AI summary + WeasyPrint (~180s di PHP)
max_execution_time = 300
post_max_size = 12M
upload_max_filesize = 10M

; orchestrator bisa lambat (tool scan) — jangan potong stream proxy
default_socket_timeout = 60

session.gc_maxlifetime = 28800
session.use_strict_mode = 1

date.timezone = UTC
